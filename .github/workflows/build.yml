name: Build

permissions:
  contents: read
  
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"

jobs:
  build:
    name: Build and Test on ${{ matrix.os }} with Meson v${{ matrix.meson_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: g++-16
            cxx: g++
          - os: macos-latest
            compiler: g++-16
            cxx: g++-16
          - os: windows-latest
            compiler: mingw-16.1.0
            cxx: g++
        meson_version: ["1.12.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install meson==${{ matrix.meson_version }} ninja
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ./build/
            ~/.cache/ccache
            ~/.ccache
            ~/.config/ccache
            ~/Library/Caches/ccache
            ${{ env.LOCALAPPDATA }}/ccache
            ${{ env.XDG_CACHE_HOME }}/ccache
          key: meson${{ matrix.meson_version }}-${{ runner.os }}-${{ matrix.compiler }}-${{ env.BUILD_TYPE }}-${{ hashFiles('./meson.build', '**/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-
      - name: Setup Cpp
        uses: aminya/setup-cpp@15a6bd8cf39030f88b5da3d203a829ec4eea4955
        with:
          compiler: ${{ matrix.compiler }}
          ccache: true
      - name: Configure Project
        run: meson setup build/
        env:
          CXX: ccache ${{ matrix.cxx }}
      - name: Build
        run: meson compile -C build/ -v
