name: Build

on:
  push:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"
  pull_request:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"

jobs:
  build:
    name: Build and Test on ${{ matrix.os }} with Meson v${{ matrix.meson_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        meson_version: ["1.11.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install meson==${{ matrix.meson_version }} ninja
      - name: Install compiler
        id: install_cc
        uses: rlalik/setup-cpp-compiler@dcaf5189c08c028eecc61c082b9993033d731224
        with:
          compiler: latest
      - if: matrix.os == 'macos-latest'
        run: brew unlink gcc && brew link gcc
      - name: Configure Project
        run: meson setup build/
        env:
          CXX: ${{ steps.install_cc.outputs.cxx }}
      - name: Build
        run: meson compile -C build/ -v
