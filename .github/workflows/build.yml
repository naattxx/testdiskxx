name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"
  pull_request:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"

jobs:
  build:
    name: Build and Test on ${{ matrix.os }} with Meson v${{ matrix.meson_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++-16
          - os: macos-latest
            compiler: clang++
          - os: windows-latest
            compiler: mingw
        meson_version: ["1.11.2"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install meson==${{ matrix.meson_version }} ninja
      - name: Setup Cpp
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d
        with:
          compiler: ${{ matrix.compiler }}
      - name: Configure Project
        run: meson setup build/
        env:
          CXX: ${{ matrix.compiler }}
      - name: Build
        run: meson compile -C build/ -v
