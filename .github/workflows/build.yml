name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.cxx"
      - "**.hpp"
      - "**.hxx"
      - "meson.build"
      - "subprojects/*.wrap"

jobs:
  build:
    name: Build and Test on ${{ matrix.os }} with Meson v${{ matrix.meson_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: g++-16
            cxx: g++
          - os: macos-latest
            compiler: clang++
            cxx: clang++
          - os: windows-latest
            compiler: mingw
            cxx: g++
        meson_version: ["1.12.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install meson==${{ matrix.meson_version }} ninja
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ./build/
            ~/.cache/ccache
            ~/.ccache
            ~/.config/ccache
            ~/Library/Caches/ccache
            ${{ env.LOCALAPPDATA }}/ccache
            ${{ env.XDG_CACHE_HOME }}/ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ env.BUILD_TYPE }}-${{ hashFiles('./meson.build', '**/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-
      - name: Setup Cpp
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d
        with:
          compiler: ${{ matrix.compiler }}
          ccache: true
      - name: Configure Project
        run: meson setup build/
        env:
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: meson compile -C build/ -v
